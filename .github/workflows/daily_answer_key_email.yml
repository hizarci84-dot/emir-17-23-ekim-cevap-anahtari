name: Emir 17-23 Ekim 2026 Gunluk Cevap Anahtari E-Posta

on:
  schedule:
    # GitHub Actions ücretsiz zamanlayıcı kuyruğu yoğun saatlerde 2-3 saat gecikebildiği için
    # kuyruğa 11:00 UTC'den (14:00 TRT) itibaren her 15 dakikada bir (off-peak dakikalarda) girer.
    # Python betiği Türkiye saati 18:00 olmadan gönderim yapmaz (17:45-18:00 arasında yakalarsa
    # tam 18:00:00'a kadar bekleyip tam 18:00'de gönderir; 18:00 sonrasında yakalarsa anında gönderir).
    - cron: '3,18,33,48 11-20 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Gonderilecek Gun Numarasi (1-6, bos birakilirsa bugunun gunu gonderilir)'
        required: false
        default: ''
      force:
        description: 'Bugun daha once gonderilmis olsa bile tekrar gonder'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: emir-daily-email
  cancel-in-progress: false

jobs:
  send-daily-answer-key:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Latest Sent History
        run: |
          git pull origin main --rebase || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Daily Answer Key Email (18:00 TRT Gate + 15 Min Retry)
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INPUT_DAY: ${{ inputs.day }}
          FORCE_SEND: ${{ inputs.force }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -u gunluk_eposta_gonder.py

      - name: Commit & Push Sent History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "Gönderim kaydı zaten güncel, commit atlanıyor."
          else
            git commit -m "chore: record daily answer key email sent [skip ci]"
            git pull origin main --rebase || true
            git push origin main
          fi
