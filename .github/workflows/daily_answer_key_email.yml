name: Emir 17-23 Ekim 2026 Gunluk Cevap Anahtari E-Posta

on:
  schedule:
    # Türkiye saati (UTC+3) ile 18:00'den (15:00 UTC) gece 23:45'e (20:45 UTC) kadar
    # her 15 dakikada bir (18:00, 18:15, 18:30, 18:45, 19:00, 19:15, ...) kontrol eder.
    # E-posta o gün gönderildiyse sent_history.json sayesinde mükerrer gönderim yapmaz;
    # GitHub sunucu yoğunluğu nedeniyle 18:00 çalışması gecikirse/atlanırsa ilk 15 dk'lık
    # döngüde otomatik olarak gönderir.
    - cron: '*/15 15-20 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Gonderilecek Gun Numarasi (1-6, bos birakilirsa bugunun gunu gonderilir)'
        required: false
        default: ''
      force:
        description: 'Bugun daha once gonderilmis olsa bile tekrar gonder'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: emir-daily-email
  cancel-in-progress: false

jobs:
  send-daily-answer-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Latest Sent History
        run: |
          git pull origin main --rebase || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Daily Answer Key Email (18:00 TRT + 15 Min Retry)
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INPUT_DAY: ${{ inputs.day }}
          FORCE_SEND: ${{ inputs.force }}
        run: |
          python -u gunluk_eposta_gonder.py

      - name: Commit & Push Sent History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "Gönderim kaydı zaten güncel, commit atlanıyor."
          else
            git commit -m "chore: record daily answer key email sent [skip ci]"
            git pull origin main --rebase || true
            git push origin main
          fi
